# ── jejak.masamune.my.id ── Jejak: aplikasi lari & sepeda ───────────
# Dipasang sebagai /etc/nginx/sites-enabled/jejak. API Node di 127.0.0.1:3014 lewat /api/,
# selain itu versi web (hasil `expo export`) dari /var/www/jejak.masamune.my.id/web.

# Batasi percobaan masuk/daftar per IP asli (IP dari Cloudflare dipulihkan oleh snippet real-ip).
limit_req_zone $binary_remote_addr zone=jejak_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name jejak.masamune.my.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jejak.masamune.my.id;

    # Cloudflare Wildcard Origin Certificate (SAN: *.masamune.my.id)
    ssl_certificate     /etc/ssl/cloudflare/masamune.my.id.pem;
    ssl_certificate_key /etc/ssl/cloudflare/masamune.my.id.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    ssl_client_certificate /etc/ssl/cloudflare/aop-ca.pem;
    ssl_verify_client on;

    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://masamune.my.id https://*.masamune.my.id;" always;

    # Track GPS satu aktivitas panjang bisa beberapa MB.
    client_max_body_size 20m;

    access_log /var/log/nginx/jejak.access.log;
    error_log  /var/log/nginx/jejak.error.log;

    # Drop noisy scanners
    if ($http_user_agent ~* (sqlmap|nikto|masscan|zgrab|acunetix|nessus)) {
        return 444;
    }

    location /api/auth/ {
        limit_req zone=jejak_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3014/auth/;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3014/;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;
    }

    root /var/www/jejak.masamune.my.id/web;

    # Berkas hasil build punya hash di namanya, aman disimpan lama.
    # add_header di dalam location menggantikan yang di level server, jadi header keamanan diulang di sini.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://masamune.my.id https://*.masamune.my.id;" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://masamune.my.id https://*.masamune.my.id;" always;
    }
}
